[package]
name = "wikillm-api"
version = "0.2.0"
edition = "2021"
description = "Self-hosted LLM knowledge base service (Rust rewrite of the TypeScript WikiLLM API)"
license = "MIT"

[[bin]]
name = "wikillm-api"
path = "src/main.rs"

[[bin]]
name = "wikillm-mcp"
path = "src/bin/mcp.rs"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
pgvector = { version = "0.4", features = ["postgres"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
notify = "7"
ulid = { version = "1", features = ["serde"] }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
flate2 = "1"
tar = "0.4"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
thiserror = "2"
async-trait = "0.1"
futures = "0.3"
rand = "0.8"
percent-encoding = "2"
libc = "0.2"

[features]
default = []
onnx = []

[profile.dev]
opt-level = 1

[dev-dependencies]
tempfile = "3.27.0"
